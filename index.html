<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Calculator</title>

<style>

/* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
}

.calculator{

    width:360px;
    background:#ffffff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);

}

#display{

    width:100%;
    height:80px;
    border:none;
    outline:none;
    background:#f1f5f9;
    border-radius:15px;
    padding:20px;
    text-align:right;
    font-size:32px;
    font-weight:600;
    color:#111827;
    margin-bottom:20px;

}

.buttons{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;

}

button{

    height:65px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:22px;
    font-weight:600;
    transition:.3s;

}
button:hover{

    transform:translateY(-3px);
    background:#dbe4ee;

}

button:active{

    transform:scale(.96);

}

.operator{

    background:#3b82f6;
    color:#fff;

}

.operator:hover{

    background:#2563eb;

}

.clear{

    background:#ef4444;
    color:#fff;

}

.clear:hover{

    background:#dc2626;

}

.delete{

    background:#f59e0b;
    color:#fff;

}

.delete:hover{

    background:#d97706;

}

.equal{

    background:#10b981;
    color:#fff;
    grid-column:span 2;

}

.equal:hover{

    background:#059669;

}

.zero{

    grid-column:span 2;

}

@media(max-width:450px){

.calculator{

    width:95%;
    padding:20px;

}

#display{

    height:70px;
    font-size:28px;

}

button{

    height:60px;
    font-size:20px;

}

}

</style>

</head>

<body>
    <div class="calculator">

    <!-- Display -->
    <input
        type="text"
        id="display"
        placeholder="0"
        readonly
    >

    <!-- Buttons -->
    <div class="buttons">

        <!-- Row 1 -->
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="delete" onclick="backspace()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <!-- Row 2 -->
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <!-- Row 3 -->
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <!-- Row 4 -->
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <!-- Row 5 -->
        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>
<script>

const display = document.getElementById("display");

// Number ya operator display par show karega
function appendValue(value){

    display.value += value;

}

// Screen clear karega
function clearDisplay(){

    display.value = "";

}

// Last character delete karega
function backspace(){

    display.value = display.value.slice(0,-1);

}

// Calculation karega
function calculate(){

    try{

        if(display.value === ""){
            return;
        }

        let result = eval(display.value);

        if(result === Infinity || result === -Infinity){

            display.value = "Cannot divide by 0";

        }else{

            display.value = result;

        }

    }

    catch{

        display.value = "Error";

    }

}

// Keyboard Support
document.addEventListener("keydown",function(e){

    const key = e.key;

    if(!isNaN(key) || key=="+" || key=="-" || key=="*" || key=="/" || key=="." || key=="%"){

        appendValue(key);

    }

    else if(key==="Enter"){

        e.preventDefault();
        calculate();

    }

    else if(key==="Backspace"){

        backspace();

    }

    else if(key==="Delete"){

        clearDisplay();

    }

});

</script>

</body>

</html>
